[project]
name = "reviews-gta6"
version = "0.1.0"
description = "Collection pipeline and analysis of GTA 6 user reviews"
requires-python = ">=3.12"
dependencies = ["httpx", "duckdb"]

[dependency-groups]
dev = ["pytest", "ruff"]
nlp = ["gensim", "nltk", "lingua-language-detector", "numpy", "scipy"]
notebook = [
    "pandas", "numpy", "scipy", "matplotlib", "seaborn", "scikit-learn",
    "nltk", "gensim", "pyldavis", "lingua-language-detector", "tqdm",
    "jupyterlab", "ipykernel", "kaggle",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviews_pipeline"]

[tool.uv]
default-groups = ["dev", "notebook"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
