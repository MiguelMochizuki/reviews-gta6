name: Collect reviews

on:
  schedule:
    - cron: "7 * * * *" # hourly head sweep
    - cron: "37 3 * * *" # daily deep sweep
  workflow_dispatch:
    inputs:
      mode:
        description: Sweep mode
        type: choice
        options: [head, deep]
        default: head

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  collect:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-default-groups
      - name: Collect
        env:
          STATE_REPO: ${{ vars.STATE_REPO }}
          GH_TOKEN: ${{ secrets.STATE_TOKEN }}
          AUTHOR_SALT: ${{ secrets.AUTHOR_SALT }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '37 3 * * *' && 'deep' || 'head') }}
        run: uv run --no-default-groups python -m reviews_pipeline.run --mode "$MODE"
      - name: Build site data
        run: uv run --no-default-groups python -m reviews_pipeline.gold --state data/state --out site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Collection run failed"
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
